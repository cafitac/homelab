# ai-sre 자기 관측 검사 — apps/ai-sre 를 kustomize 로 렌더해 promtool check · test rules 를 돌리고(경보가 뜨는 때 · 안 뜨는 때),
# 규칙이 ai-sre 가 실제로 내는 지표 이름만 쓰는지 본다. 클러스터에는 닿지 않는다.
# 러너에 깔린 kubectl(kustomize 만) · yq · docker 를 쓴다. promtool 은 테스트가 고정한 prometheus 이미지(digest)에서 돌린다.
name: ai-sre-monitoring

on:
  pull_request:
    paths:
      - apps/ai-sre/**
      - .github/workflows/ai-sre-monitoring.yml
  push:
    branches: [main]
    paths:
      - apps/ai-sre/**
      - .github/workflows/ai-sre-monitoring.yml

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: kubectl version --client && yq --version && docker version --format '{{.Server.Version}}'
      - run: python3 -m unittest -v apps/ai-sre/monitoring_test.py
