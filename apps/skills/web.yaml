apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: skills-dashboard
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000 }
            # 내부 앱(러너 API · /metrics). 이미지가 아직 이 포트를 열지 않으면 아무것도 듣지 않는다(U21b). Service web-internal 만 가리키며 Ingress 에는 없다.
            - { containerPort: 8001, name: internal }
          envFrom:
            - secretRef: { name: skills-access }
          env:
            - { name: SKILLS_DATA_DIR, value: /data }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            # 러너 HMAC 키 파일(파일 이름 hmac-key). Secret 이 없으면 빈 디렉터리이고 내부 앱은 서명 호출을 모두 거부한다(fail closed).
            - { name: runner-hmac, mountPath: /run/runner-hmac, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data }
        - name: runner-hmac
          secret: { secretName: runner-hmac, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8000 }]
---
# 러너 전용 ClusterIP — 접근은 internal-ingress.yaml 정책이 skills-runner 의 app: runner 파드로 좁힌다. 어느 Ingress 도 이 Service 를 가리키지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: web-internal
spec:
  type: ClusterIP
  selector: { app: web }
  ports: [{ name: internal, port: 8001, targetPort: internal }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  rules:
    - host: skills.cafitac.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
