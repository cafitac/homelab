# homelab 경보 규칙. 차트 기본 규칙(노드 · 쿠버네티스)에 더해, 실제로 겪은 장애를 막는 것만 둔다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: homelab.disk
      rules:
        # 10/3 thread-example 은 VM 데이터 디스크가 차서 33 시간 멈췄다. 이 클러스터의 PV 와 이미지가 모두 이 디스크에 있다
        - alert: NodeDataDiskFillingUp
          expr: |
            1 - node_filesystem_avail_bytes{mountpoint="/var/lib/rancher"}
              / node_filesystem_size_bytes{mountpoint="/var/lib/rancher"} > 0.80
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "k8s 노드 데이터 디스크 {{ $value | humanizePercentage }} 사용"
            description: "PV · 이미지가 있는 디스크다. 90% 를 넘기 전에 PVC 를 정리하거나 cluster/up.sh 의 --disk 를 늘린다"
        - alert: NodeDataDiskAlmostFull
          expr: |
            1 - node_filesystem_avail_bytes{mountpoint="/var/lib/rancher"}
              / node_filesystem_size_bytes{mountpoint="/var/lib/rancher"} > 0.90
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "k8s 노드 데이터 디스크 {{ $value | humanizePercentage }} — 곧 DB 가 멈춘다"
    - name: homelab.prometheus
      rules:
        # ⭐ Prometheus 데이터는 retention 15d · retentionSize 25GB 중 먼저 닿는 쪽에서 오래된 블록부터 지운다(PVC 30Gi).
        #    25GB 에 가까워지면 15 일을 못 채우고 잘리기 시작한 것이다 — 수집 대상 · 라벨이 늘었다는 뜻이다
        - alert: PrometheusStorageNearRetentionSize
          expr: sum(prometheus_tsdb_storage_blocks_bytes + prometheus_tsdb_wal_storage_size_bytes) > 0.9 * 25e9
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Prometheus 데이터 {{ $value | humanize1024 }}B — retentionSize 25GB 의 90%"
            description: "보존 기간 15 일보다 먼저 크기 상한으로 잘리고 있다. 수집 대상 · 카디널리티를 줄이거나 retentionSize 와 PVC 를 함께 늘린다"
    - name: homelab.sites
      rules:
        # 10/3 장애는 화면에 오류율 100% 가 떠 있었는데 아무도 몰랐다
        - alert: PublicSiteDown
          expr: probe_success{job="probe/monitoring/public-sites"} == 0
          for: 3m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.instance }} 가 밖에서 열리지 않는다"
