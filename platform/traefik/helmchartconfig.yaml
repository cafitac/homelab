# ⭐ Traefik 을 클러스터 안에서만 연다(ClusterIP).
#    k3s 기본은 LoadBalancer + servicelb 라 VM 의 80/443 에 붙고, colima(lima)는 VM 에서 열린 포트를 Mac 의 모든 인터페이스로
#    넘긴다 → LAN · tailnet 에서 Mac:80 에 Host 헤더만 붙이면 Cloudflare Access 를 거치지 않고 Prometheus · Grafana 에 닿았다(2026-10-05 발견).
#    외부 요청은 cloudflared → traefik.kube-system.svc 로만 들어오므로 노드 포트가 필요 없다.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  # ⭐ ClusterIP 라 Ingress status 에 주소가 채워지지 않고, Argo CD 는 그런 Ingress 를 계속 Progressing 으로 본다.
  #    Traefik 이 Ingress 마다 대표 주소(실제 경로인 터널 이름)를 적게 한다 — 접속에는 쓰이지 않는 표시용이다
  valuesContent: |-
    service:
      type: ClusterIP
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
    additionalArguments:
      - --providers.kubernetesingress.ingressendpoint.hostname=tunnel.homelab
