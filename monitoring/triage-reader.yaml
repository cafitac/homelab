# 점검 에이전트(interview-coach .github/workflows/triage.yml)의 읽기 전용 계정 — Prometheus · Alertmanager · Loki 의 HTTP API 를
# API 서버 프록시로 GET 하는 것만 된다. 파드 · Secret · 로그 · 다른 namespace 는 못 본다. 쓰기 없음.
# 토큰 → Mac Studio 의 ~/.kube/triage.yaml: monitoring/triage-kubeconfig.sh (사람이 한 번 실행)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-reader
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: triage-reader
  namespace: monitoring
rules:
  # 프록시 URL 의 이름은 「서비스:포트」 — /api/v1/namespaces/monitoring/services/loki:3100/proxy/...
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames:
      - kps-kube-prometheus-stack-prometheus:9090
      - kps-kube-prometheus-stack-alertmanager:9093
      - loki:3100
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: triage-reader
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: triage-reader
subjects:
  - kind: ServiceAccount
    name: triage-reader
    namespace: monitoring
---
# 오래 가는 토큰(점검은 몇 시간마다 돈다). 지우면 토큰도 무효
apiVersion: v1
kind: Secret
metadata:
  name: triage-reader-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: triage-reader
type: kubernetes.io/service-account-token
