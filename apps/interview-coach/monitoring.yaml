# 앱 지표 수집 · 경보 규칙. 지표 목록 · 뜻은 interview-coach 저장소 docs/MONITORING.md
# ⭐ 경보는 Alertmanager 화면 · API 에만 남는다 — 수신처를 연결하지 않는다(사용자 결정 2026-10-05 · 2026-10-24 「경보는 일단 안 해도」).
#    나중에 에이전트가 이 경보를 읽어 처리한다(interview-coach .dev/features/20261024-monitoring S6)
# 대시보드는 monitoring/dashboards/interview-coach.json (Grafana 사이드카가 monitoring namespace 만 본다)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app
spec:
  # job 라벨 = Service 이름(server · knowledge)
  selector:
    matchExpressions:
      - { key: app, operator: In, values: [server, knowledge] }
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app
spec:
  groups:
    - name: interview-coach.app
      rules:
        # absent — 수집 대상이 아예 없을 때(ServiceMonitor 가 Service 를 못 고름)는 up 시계열이 없어 == 0 으로는 안 잡힌다(2026-10-24 겪음)
        - alert: InterviewCoachTargetDown
          expr: |
            up{namespace="interview-coach", job=~"server|knowledge"} == 0
            or absent(up{namespace="interview-coach", job="server"})
            or absent(up{namespace="interview-coach", job="knowledge"})
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "interview-coach {{ $labels.job }} 지표를 5분째 못 읽는다"
            description: "파드가 죽었거나 /actuator/prometheus 가 응답하지 않는다. 대상 자체가 없으면 Service 라벨 app 과 ServiceMonitor app 을 본다"
        # ⚠️ Micrometer 는 결과 라벨 조합이 처음 생길 때 시계열을 만든다 — increase() 는 처음 생긴 시계열의 첫 값을 세지 않으므로
        #    「30분 전에는 없던 시계열」도 함께 본다(서버가 뜬 뒤 첫 실패). 단 값이 0 보다 클 때만 — 브라우저 오류 카운터처럼 0 으로
        #    미리 등록한 시계열은 새 파드가 뜨기만 해도 「새 시계열」이 된다(2026-10-24 배포 뒤 InterviewCoachClientError 오탐)
        - alert: InterviewCoachJobFailed
          expr: |
            sum by (kind) (increase(coach_pipeline_jobs_seconds_count{namespace="interview-coach", outcome=~"failed|error"}[30m])) > 0
            or
            sum by (kind) ((coach_pipeline_jobs_seconds_count{namespace="interview-coach", outcome=~"failed|error"} > 0)
              unless coach_pipeline_jobs_seconds_count{namespace="interview-coach", outcome=~"failed|error"} offset 30m)
          labels: { severity: warning }
          annotations:
            summary: "파이프라인 {{ $labels.kind }} 작업이 끝내 실패했다(최근 30분)"
            description: "사용자 화면에 실패가 떴다. 원인: app.jobs 의 error · step, server 로그 「잡 단계 실패」"
        - alert: InterviewCoachLlmUsageLimit
          expr: |
            sum (increase(coach_llm_calls_seconds_count{namespace="interview-coach", outcome="usage_limit"}[15m])) > 0
            or
            sum ((coach_llm_calls_seconds_count{namespace="interview-coach", outcome="usage_limit"} > 0)
              unless coach_llm_calls_seconds_count{namespace="interview-coach", outcome="usage_limit"} offset 15m)
          labels: { severity: critical }
          annotations:
            summary: "LLM 사용량 한도 — 모든 계정이 막혔다"
            description: "면접 · 준비가 멈춘다. 한도가 풀릴 때까지 기다리거나 두 번째 계정(CLAUDE_CODE_OAUTH_TOKEN_FALLBACK)을 확인한다"
        # 사용자가 한 명이라 호출이 적다 — 최소 5건일 때만 비율을 본다
        - alert: InterviewCoachLlmErrorRate
          expr: |
            sum by (skill) (increase(coach_llm_calls_seconds_count{namespace="interview-coach", outcome!="ok"}[1h]))
              / sum by (skill) (increase(coach_llm_calls_seconds_count{namespace="interview-coach"}[1h])) > 0.3
            and sum by (skill) (increase(coach_llm_calls_seconds_count{namespace="interview-coach"}[1h])) >= 5
          labels: { severity: warning }
          annotations:
            summary: "LLM 스킬 {{ $labels.skill }} 호출의 {{ $value | humanizePercentage }} 가 실패(최근 1시간)"
            description: "outcome 별로 나눠 본다(Grafana interview-coach 대시보드). 원인: app.llm_calls 의 error"
        - alert: InterviewCoachDeepDiveTurnFailed
          expr: |
            sum by (reason) (increase(coach_deepdive_turns_total{namespace="interview-coach", outcome="failed"}[30m])) > 0
            or
            sum by (reason) ((coach_deepdive_turns_total{namespace="interview-coach", outcome="failed"} > 0)
              unless coach_deepdive_turns_total{namespace="interview-coach", outcome="failed"} offset 30m)
          labels: { severity: warning }
          annotations:
            summary: "깊이 파기 턴이 실패했다({{ $labels.reason }}, 최근 30분)"
        # 브라우저 오류(interview-coach POST /api/client-errors) — 내용은 Loki: {namespace="interview-coach", app="server"} |= "브라우저 오류"
        - alert: InterviewCoachClientError
          expr: |
            sum by (kind) (increase(coach_client_errors_total{namespace="interview-coach", outcome="logged"}[30m])) > 0
            or
            sum by (kind) ((coach_client_errors_total{namespace="interview-coach", outcome="logged"} > 0)
              unless coach_client_errors_total{namespace="interview-coach", outcome="logged"} offset 30m)
          labels: { severity: warning }
          annotations:
            summary: "화면에서 {{ $labels.kind }} 오류가 났다(최근 30분)"
            description: "Grafana Explore(Loki): {namespace=\"interview-coach\", app=\"server\"} |= \"브라우저 오류\""
        # 분당 상한(60)을 넘겨 버린 보고 — 오류 폭주이거나 누가 공개 주소로 마구 보내는 중
        - alert: InterviewCoachClientErrorFlood
          expr: sum (increase(coach_client_errors_total{namespace="interview-coach", outcome="dropped"}[10m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "브라우저 오류 보고가 분당 상한을 넘어 버려지고 있다"
            description: "같은 오류가 반복되는지 Loki 에서 보고, 아니면 /api/client-errors 를 누가 부르는지 server ApiAccess 로그를 본다"
        # 음성 턴(interview-coach POST /api/telemetry/voice) — 2자 이하로 끝나 보낸 턴은 말이 끊겨 일찍 보낸 것(2026-10 「나」 사건)
        - alert: InterviewCoachVoiceShortTurns
          expr: |
            sum by (surface) (increase(coach_voice_turns_total{namespace="interview-coach", length="short"}[1h]))
              / sum by (surface) (increase(coach_voice_turns_total{namespace="interview-coach"}[1h])) > 0.2
            and sum by (surface) (increase(coach_voice_turns_total{namespace="interview-coach"}[1h])) >= 5
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.surface }} 음성 턴의 {{ $value | humanizePercentage }} 가 2자 이하로 끝났다(최근 1시간)"
            description: "Loki: {namespace=\"interview-coach\", app=\"server\"} |= \"음성 턴\" |= \"length=short\" — 침묵 판정(apps/web/src/lib/endOfTurn.ts)을 의심한다"
        # no-speech 는 조용히 있었을 뿐이라 뺀다
        - alert: InterviewCoachVoiceRecognitionErrors
          expr: |
            sum by (surface, code) (increase(coach_voice_recognition_errors_total{namespace="interview-coach", code!="no-speech"}[30m])) >= 3
          labels: { severity: warning }
          annotations:
            summary: '{{ $labels.surface }} 음성 인식 오류 {{ $labels.code }} {{ $value | printf "%.0f" }}번(최근 30분)'

        # ── 이상 감시(2026-10-29 사건: #444 배포 뒤 서버 → Umami 사건이 몇 시간 내내 전부 실패, TTS 문장 사이 4~6초 멈춤 — 둘 다 자동으로 못 잡았다) ──
        # server → Umami 전송 실패(analytics_umami_events_total{result="failed"}). 사건 때는 HTTP/2 업그레이드 오류로 100% 실패 + 매분 WARN (#447 에서 고침)
        #    위 InterviewCoachJobFailed 와 같은 「새 시계열」 관용구 — 단 두 갈래 모두 > 0 일 때만(homelab#132: 0 으로 등록된 카운터가 새 파드에서 「새 시계열」로 오탐)
        #    분석 수집이라 사용자 화면에는 영향이 없다 → warning
        - alert: InterviewCoachUmamiSendFailing
          expr: |
            sum (increase(analytics_umami_events_total{namespace="interview-coach", result="failed"}[15m])) > 0
            or
            sum ((analytics_umami_events_total{namespace="interview-coach", result="failed"} > 0)
              unless analytics_umami_events_total{namespace="interview-coach", result="failed"} offset 15m)
          labels: { severity: warning }
          annotations:
            summary: "server 가 Umami 로 사건을 보내지 못하고 있다(최근 15분)"
            description: "Loki: {namespace=\"interview-coach\", app=\"server\"} |= \"Umami\" 의 WARN 을 본다. UMAMI_ORIGIN(server.yaml) · umami Service · server-egress 정책 · HTTP 클라이언트(2026-10 HTTP/2 업그레이드 사건)를 의심한다"
        # TTS 문장 기다림 p95 — 첫 문장은 첫 소리까지, 이후 문장은 문장 사이 틈. source="server" 일 때만 기록(기기 대체 음성은 빠진다).
        #    임계값 3000ms: 사건 때 4000~6000ms 멈춤이 났고, 문장 사이 틈이 3초를 넘으면 듣는 쪽에서 끊긴다고 느낀다 → 사건 값보다 낮게 잡아 일찍 본다.
        #    표본이 적은 단일 사용자라 p95 가 한두 문장에 좌우된다 — 30분 창 + for 10m 으로 한 문장짜리 튐은 거른다.
        #    표본이 없으면 histogram_quantile 이 NaN 이라 비교가 거짓이 된다(경보 안 남) — 카운터 「새 시계열」 관용구는 여기 해당하지 않는다
        #    (참고: 말이 끝난 뒤 첫 답 소리까지의 시간 coach_voice_reply_first_audio_seconds 는 여기서 안 보고 후속으로 따로 본다)
        - alert: InterviewCoachTtsStallHigh
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(coach_voice_tts_sentence_wait_ms_bucket{namespace="interview-coach"}[30m]))) > 3000
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: 'TTS 문장 기다림 p95 가 {{ $value | printf "%.0f" }}ms (최근 30분, 기준 3000ms)'
            description: "문장 사이가 끊긴다. surface 별로 나눠 Grafana interview-coach 대시보드에서 보고, modelhost(Mac Studio 8800) 합성 지연 · 부하를 먼저 의심한다"
        # 트래픽은 있는데 Umami 로 간 사건이 0 — 오늘 사건(100% 실패가 몇 시간 방치)을 가장 직접 잡는 경보. 실패 카운터가 안 늘어나는 고장(전송 코드가 아예 안 돈다 등)도 잡는다
        #    트래픽 = 화면 요청 수(actuator 지표 수집 · 헬스 확인은 늘 오므로 뺀다). 사용자가 한 명이라 30분에 20건 미만이면 쓰는 중이 아니라고 본다
        #    result="sent" 시계열은 성공이 한 번도 없으면 아예 안 생긴다 → or vector(0) 으로 「없음」도 0 으로 본다(absent 는 라벨이 달라 and 로 못 잇는다)
        #    화면 요청이 Umami 사건을 만들지 않는 구간(관리 화면만 폴링 등)에서는 오탐 가능 — for 15m + 30분 창으로 줄였다. 주 목적은 30~60분 안에 알아채는 것
        - alert: InterviewCoachUmamiSendStalled
          expr: |
            sum (increase(http_server_requests_seconds_count{namespace="interview-coach", job="server", uri!~"/actuator.*"}[30m])) >= 20
            and
            (sum (increase(analytics_umami_events_total{namespace="interview-coach", result="sent"}[30m])) or vector(0)) == 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "최근 30분 화면 요청은 있는데 Umami 로 간 사건이 0 이다"
            description: "server → Umami 전송이 통째로 막혔다. result=failed 가 늘면 InterviewCoachUmamiSendFailing 도 함께 뜬다. 아니면 UMAMI_ORIGIN · umami Pod · 사용 기록 끄기 설정(전역 스위치)을 본다"
        # ⚠️ 알려진 공백: modelhost(Mac Studio launchd, 127.0.0.1:8800)는 Prometheus 가 긁지 않는다(ServiceMonitor 없음 · /metrics 없음) — 끝 잘림 · 음높이 흔들림 감시(D7)는 여기서 다루지 않는다
