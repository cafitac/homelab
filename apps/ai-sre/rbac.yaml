# ai-sre-reader — Argo CD Application 의 현재 동기화 리비전 · 건강 상태만 읽는다(설계 07 §3.5). 이력은 ai-sre 의 원장이 쌓는다.
# 범위: argocd namespace 의 applications.argoproj.io 를 get · list · watch. 쓰기 · Secret · 다른 리소스 · 다른 namespace 없음.
# 아직 어떤 파드도 이 계정을 쓰지 않는다 — DEPLOY_OBSERVE 를 연결하는 단위가 worker 의 serviceAccountName · 토큰 · k8s API egress 를 함께 연다.
# Role · RoleBinding 은 argocd 에 있다. kustomization.yaml 의 namespace 변환이 unsetOnly 라 적어 둔 namespace 를 덮어쓰지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sre-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-reader
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-reader
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-sre-reader
subjects:
  - kind: ServiceAccount
    name: ai-sre-reader
    namespace: ai-sre
