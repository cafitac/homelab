# interview.cafitac.com — interview-coach(비공개 저장소). AI 모의 면접.
# 이미지 갱신: 자동 — interview-coach 의 develop 에 병합하면 그 저장소 deploy.yml 이 아래 네 태그를 바꾸는 커밋을 main 에 직접 넣는다
#   (작성자 "interview-coach deploy", 배포 키). 손으로 고치지 말 것 — 되돌리기 · 손 배포는 interview-coach 의 deploy/README.md
# 비밀값: secrets.sh(Mac Studio 에서 실행)가 Mac Studio 의 .env 파일들로 Secret 을 만든다 — 저장소에 없다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: interview-coach
resources:
  - namespace.yaml
  - quota.yaml
  - db.yaml
  - embedder.yaml
  - knowledge.yaml
  - server.yaml
  - server-egress.yaml
  - web.yaml
  - backup.yaml
  - monitoring.yaml
  - umami.yaml
components:
  - ../../platform/components/isolation
images:
  - { name: interview-coach-server, newTag: 4e7ec6cc27a9 }
  - { name: interview-coach-knowledge, newTag: 543fa5cc21bd }
  - { name: interview-coach-embedder, newTag: 543fa5cc21bd }
  - { name: interview-coach-web, newTag: 4e7ec6cc27a9 }
