# trading.cafitac.com — tradelab 대시보드(읽기 전용 FastAPI + React) · 쓰기 Job 틀 · 백업. 앞단은 Cloudflare Access.
# 이미지 갱신: trading-system 저장소에서 deploy/k8s/release.sh — 출력된 두 newTag(같은 태그)를 아래에 넣는다.
#   lab.yaml 의 TRADELAB_BUILD_SHA 도 같은 값으로 바꾼다
# 비밀값: secrets.sh(Mac Studio, 사용자가 손으로) — 저장소에 없다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trading
resources:
  - namespace.yaml
  - quota.yaml
  - data.yaml
  - lab.yaml
  - batch.yaml
  - backup.yaml
components:
  - ../../platform/components/isolation
configMapGenerator:
  - name: backup-script
    files:
      - backup.py=scripts/backup.py
images:
  - name: trading-lab
    newTag: 99f1956cfc76        # image ID sha256:ebef630f68db09a64bfef1b67f44aada1c11e86f9928335b23bcea04ec57c76f
  - name: trading-batch
    newTag: 99f1956cfc76        # image ID sha256:726d776ef74442812a0d24d3d9ff1651df2004608cb6c56aa838ad43cbeaa112
