# 실행기 — 채점판에서 일감을 받아 리그(docker compose)를 돌리고 grade.py 채점표를 보고한다.
# ⭐ 같은 파드의 dockerd 사이드카(DinD)를 DOCKER_HOST 로 부린다. 리그 compose · run.sh · grade.py 는 참가자가
#    로컬에서 쓰는 것과 같다(같은 채점기 원칙) — k8s 매니페스트로 다시 만들지 않는다.
# ⭐ 자원 보장(Guaranteed QoS: 모든 컨테이너 requests = limits) — 공식 채점 점수가 다른 서비스와의 CPU 경쟁에
#    흔들리지 않게. 리그 한 판의 compose cpus 합(5.5)이 dockerd 6 코어 안쪽이다. 한 파드 = 한 줄(한 번에 한 판)
# ⚠️ dockerd 는 privileged 다 — 참가자 코드는 이 dockerd 안에서만 돈다. 리그 검사(docker.sock 마운트 금지 ·
#    채점 장비 변조 감지)는 runner(worker.py)가 그대로 한다
apiVersion: v1
kind: Service
metadata:
  name: runner
spec:
  clusterIP: None
  selector: { app: runner }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runner
spec:
  serviceName: runner
  # ⭐ 평소 0 — 6 코어를 독점(static CPU manager)하므로 채점이 없을 때 다른 서비스 · thread-example 측정 몫을 막지 않는다.
  #    스터디 채점 시간에만 올린다: kubectl -n judge-board scale sts/runner --replicas=1 (끝나면 0).
  #    Argo CD 는 replicas 를 무시한다(argocd/apps/judge-board.yaml ignoreDifferences) — 손으로 올린 값을 되돌리지 않는다
  #    공식 채점 2 줄이면 2 — 14 코어라 thread-example 측정과 동시에 돌리지 않는다
  replicas: 0
  selector:
    matchLabels: { app: runner }
  template:
    metadata:
      # homelab/egress: restricted — 공통 격리의 넓은 나가기 허용(egress-no-host)에서 빠지고 runner-egress 만 따른다
      labels: { app: runner, homelab/egress: restricted }
    spec:
      enableServiceLinks: false
      initContainers:
        # 네이티브 사이드카 — 이게 준비(startupProbe)된 뒤에 runner 가 뜬다
        - name: dockerd
          image: docker:27-dind
          restartPolicy: Always
          securityContext: { privileged: true }
          env:
            - { name: DOCKER_TLS_CERTDIR, value: "" }
          # ⚠️ 파드 안(127.0.0.1)에서만 받는다. dind 진입 스크립트는 TLS 를 끄면 0.0.0.0:2375 를 기본으로 더해
          #    포트가 겹쳐 죽었다(2026-10-05) — dockerd 를 직접 적고 -H 로 주소를 하나만 준다.
          #    진입 스크립트(cgroup 중첩 준비)는 그대로 거친다
          args: ["dockerd", "-H", "tcp://127.0.0.1:2375", "--tls=false"]
          startupProbe:
            exec: { command: [docker, -H, "tcp://127.0.0.1:2375", info] }
            periodSeconds: 2
            failureThreshold: 60
          volumeMounts:
            - { name: docker, mountPath: /var/lib/docker }
            - { name: data, mountPath: /data }
          # 한 판 리그가 쓰는 건 5.5 코어(compose cpus 합) — 6 이면 빌드 · dockerd 몫 0.5 가 남는다.
          # 7 이었을 때 thread-example 이 k8s 로 온 뒤(2026-10-05) 자리가 없어 Pending 이었다. 6.5 코어면
          # preemptible 부속 셋(4 코어)을 밀어내고 들어간다
          resources:
            requests: { cpu: "6", memory: 8Gi }
            limits: { cpu: "6", memory: 8Gi }
      containers:
        - name: runner
          image: judge-board-runner
          imagePullPolicy: IfNotPresent
          env:
            - { name: DOCKER_HOST, value: "tcp://127.0.0.1:2375" }
            - { name: BOARD_URL, value: "http://board:8780" }
            - { name: BOARD_TOKEN, valueFrom: { secretKeyRef: { name: board-env, key: RUNNER_TOKEN } } }
            - { name: SANDBOX_DIR, value: /data/packs }
            - { name: WORK_DIR, value: /data/work }
            - { name: WORKER_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: WORKER_KIND, value: official }
            - { name: RIG_PORT_RANGE, value: "55500-55999" }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data }
  volumeClaimTemplates:
    - metadata:
        name: docker
      spec:
        accessModes: [ReadWriteOnce]
        # 리그 이미지 · 빌드 캐시(runner 가 168 시간 지난 캐시를 비운다)
        resources: { requests: { storage: 40Gi } }
