apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cafitac/homelab.git
    targetRevision: main
    path: apps/trading
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # ⚠️ prune 끔 — DB(trading-data) · 백업(trading-backups) PVC
    automated: { prune: false, selfHeal: true }
