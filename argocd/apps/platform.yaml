apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cafitac/homelab.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # ⚠️ prune 을 끈다 — 플랫폼(터널 · Traefik)이 실수로 지워지면 모든 사이트가 내려간다
    automated: { prune: false, selfHeal: true }
