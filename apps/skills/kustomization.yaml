# 순서: Access 앱 skills(정책 owner) → 이미지 빌드와 newTag → secrets.sh → 머지(Argo 동기화) → import.sh → probes.sh.
# *.cafitac.com 은 이미 Traefik 에 닿으므로 Access 를 먼저 만든다. 백업도 같은 namespace 에서 돈다.
# merge-gate.sh 는 태그 형식(소문자 16진수 12 자리)만 검사한다. Mac Studio 에서 실제 빌드·import 했다는 것은 owner 보고(머지 게이트 3)이며 스크립트가 증명하지 않는다. unset-h2 는 H2 전 상태뿐이다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skills
resources: [namespace.yaml, quota.yaml, data.yaml, egress.yaml, internal-ingress.yaml, web.yaml, backup.yaml]
components: [../../platform/components/isolation]
configMapGenerator:
  - name: backup-script
    files: [backup.py]
generatorOptions:
  disableNameSuffixHash: true
# 이미지는 레지스트리 없이 태그=커밋으로 가져온다(PLAN.md 3 단계, apps/ppt 와 같다); digest 고정은 쓰지 않는다. 빌드한 image ID 는 머지 전에 PR 에 적는다.
images:
  - name: skills-dashboard
    newTag: "492a3a0efaa8"
