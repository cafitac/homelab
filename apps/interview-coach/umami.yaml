# Umami v3 — interview-coach 화면 흐름 · 불편 신호의 저장소 겸 화면(퍼널 · 여정 · 세션). agent-skills ux-telemetry 스킬.
# 브라우저는 web 의 같은 출처 경로 두 개(/ux/script.js · /ux/api/send)로만 닿는다 — Ingress 없음. 화면은 포트 포워드로만:
#   kubectl -n interview-coach port-forward svc/umami 3000:3000  → http://localhost:3000 (처음 admin/umami → 바로 비밀번호 변경)
# 화면 녹화 · 히트맵은 켠다(사용자 결정 2026-10-26 「내 컴에만 저장되면 괜찮음」) — 데이터는 이 Postgres(Mac Studio 외장 SSD)에만.
# 입력칸 값 · 비밀번호는 가리고(maskLevel moderate), 주요 여정 화면만, 페이지 로드당 10분(interview-coach deploy/ux-telemetry/umami-setup.sh).
# 보존: 녹화 30일 · 히트맵 · 이벤트 90일(아래 CronJob). 크기 경보: postgres-exporter + monitoring.yaml.
# 비밀값 umami-auth 는 secrets.sh 가 처음 한 번 만든다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: umami-db
spec:
  serviceName: umami-db
  replicas: 1
  selector:
    matchLabels: { app: umami-db }
  template:
    metadata:
      labels: { app: umami-db }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: umami }
            - { name: POSTGRES_DB, value: umami }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: umami-auth, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U umami -d umami"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
        # DB 크기 지표(pg_database_size_bytes) — 녹화가 디스크를 채우기 전에 경보(monitoring.yaml UmamiDbLarge)
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          env:
            - { name: DATA_SOURCE_URI, value: "localhost:5432/umami?sslmode=disable" }
            - { name: DATA_SOURCE_USER, value: umami }
            - { name: DATA_SOURCE_PASS, valueFrom: { secretKeyRef: { name: umami-auth, key: POSTGRES_PASSWORD } } }
          ports: [{ name: metrics, containerPort: 9187 }]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: umami-db
  labels: { app: umami-db }
spec:
  selector: { app: umami-db }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
    - { name: metrics, port: 9187, targetPort: 9187 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
spec:
  replicas: 1
  selector:
    matchLabels: { app: umami }
  template:
    metadata:
      labels: { app: umami }
    spec:
      enableServiceLinks: false
      containers:
        - name: umami
          # 태그는 손으로 올린다 — 올리기 전에 릴리스 노트(스키마 · /api/send 바뀜)를 본다
          image: ghcr.io/umami-software/umami:3.4.1
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: umami-auth, key: DATABASE_URL } } }
            - { name: APP_SECRET, valueFrom: { secretKeyRef: { name: umami-auth, key: APP_SECRET } } }
            - { name: DISABLE_TELEMETRY, value: "1" }
            - { name: DISABLE_UPDATES, value: "1" }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /api/heartbeat, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 160Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: umami
spec:
  selector: { app: umami }
  ports: [{ port: 3000, targetPort: 3000 }]
---
# 보존: Umami 는 자체 보존 설정이 없다 — 매일 녹화는 30일, 히트맵 · 이벤트는 90일 넘은 행을 지운다(agent-skills skills/ux-telemetry/references/pipeline.md)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: umami-retention
spec:
  schedule: "30 4 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: retention
              image: postgres:17-alpine
              env:
                - { name: PGHOST, value: umami-db }
                - { name: PGUSER, value: umami }
                - { name: PGDATABASE, value: umami }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: umami-auth, key: POSTGRES_PASSWORD } } }
              command:
                - psql
                - -v
                - ON_ERROR_STOP=1
                - -c
                - |
                  delete from event_data where created_at < now() - interval '90 days';
                  delete from website_event where created_at < now() - interval '90 days';
                  delete from session_data where created_at < now() - interval '90 days';
                  delete from heatmap_event where created_at < now() - interval '90 days';
                  delete from session_replay where created_at < now() - interval '30 days';
                  delete from session s where created_at < now() - interval '90 days'
                    and not exists (select 1 from website_event e where e.session_id = s.session_id)
                    and not exists (select 1 from session_replay r where r.session_id = s.session_id);
                  select pg_size_pretty(pg_database_size('umami')) as umami_db_size;
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 64Mi }
