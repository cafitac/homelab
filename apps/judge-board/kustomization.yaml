# gather.cafitac.com — judge-board(비공개 저장소). 실습 문제를 실제로 돌려 채점하는 스터디 채점판.
# 이미지 갱신: judge-board 저장소에서 deploy/release.sh — 빌드하고 아래 newTag 를 main 에 바로 커밋한다(세 개 같은 태그)
# 비밀값: secrets.sh(Mac Studio) — 저장소에 없다. 문제 꾸러미 동기화: sync-packs.sh
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: judge-board
resources:
  - namespace.yaml
  - quota.yaml
  - db.yaml
  - data.yaml
  - board.yaml
  - frontend.yaml
  - runner.yaml
  - runner-egress.yaml
  - runner-autoscale.yaml
  - backup.yaml
components:
  - ../../platform/components/isolation
images:
  - { name: judge-board-board, newTag: ce77ab7d18ca }
  - { name: judge-board-frontend, newTag: ce77ab7d18ca }
  - { name: judge-board-runner, newTag: ce77ab7d18ca }
