# 0 단계 검증용 — 외부 접속(터널 → Traefik → Ingress) · PV 가 SSD 에 생기는지 · VM 재시작 뒤 자동 복구.
# 검증이 끝나면 지운다: kubectl delete -k apps/hello
apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: hello
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
spec:
  replicas: 1
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      initContainers:
        # PV 에 파일을 쓰고 그 파일을 그대로 내보낸다 — 재시작 뒤에도 같은 내용이면 PV 가 살아 있는 것이다
        - name: seed
          image: busybox:1.37
          command: ["sh", "-c", "[ -f /data/index.html ] || echo \"hello from homelab — written $(date -u +%FT%TZ)\" > /data/index.html"]
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts: [{ name: data, mountPath: /usr/share/nginx/html, readOnly: true }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data }
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello
spec:
  selector: { app: hello }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: hello
spec:
  rules:
    - host: hello.cafitac.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: hello, port: { number: 80 } }
