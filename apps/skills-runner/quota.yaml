# ⚠️ 잠정 값 — OG-2(S0 한도)가 U19s 측정표로 정하기 전까지의 상한이다. 러너 파드(agent · publisher · checker) 하나와 프록시 하나가 들어가는 크기로 잡았다.
# 영구 볼륨은 쓰지 않는다(작업 공간은 emptyDir). 외부 노출 Service 는 만들 수 없다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
spec:
  hard:
    pods: "4"
    requests.cpu: "1"
    requests.memory: 2Gi
    requests.ephemeral-storage: 4Gi
    limits.cpu: "3"
    limits.memory: 6Gi
    limits.ephemeral-storage: 10Gi
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
