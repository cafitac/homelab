# trading.cafitac.com — tradelab 대시보드(읽기 전용 FastAPI + React) · 쓰기 Job 틀 · 백업. 앞단은 Cloudflare Access.
# 이미지 갱신: trading-system 저장소에서 deploy/k8s/release.sh — 출력된 두 newTag(같은 태그)를 아래에 넣는다.
#   lab.yaml 의 TRADELAB_BUILD_SHA 도 같은 값으로 바꾼다
# 비밀값: secrets.sh(Mac Studio, 사용자가 손으로) — 저장소에 없다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trading
resources:
  - namespace.yaml
  - quota.yaml
  - data.yaml
  - lab.yaml
  - batch.yaml
  - paper.yaml
  - backup.yaml
components:
  - ../../platform/components/isolation
configMapGenerator:
  - name: backup-script
    files:
      - backup.py=scripts/backup.py
images:
  - name: trading-lab
    newTag: "f7546feb529f"       # image ID sha256:612bce886a56638fcbaa52e9b02a6b295552e8a66f6dfe3ca59f2b764c8dd806
  - name: trading-batch
    newTag: "f7546feb529f"       # image ID sha256:8f5b70e08de347b8fbc0066dd8e51ea48e72c959a7ad8607c1e238f25caa50b4
