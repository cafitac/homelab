# 프리뷰 이미지 레지스트리. buildkitd 는 Service(registry:5000)로 push, 노드(docker 런타임)는 localhost:5000 으로 받는다.
# ⭐ hostPort 를 127.0.0.1 에만 묶는다 — iptables 로만 처리되어 VM 에 소켓이 없고 lima 가 Mac 으로 넘기지 않는다(2026-10-05 확인).
#    0.0.0.0 이면 LAN · tailnet 에 열린다 — platform 규칙의 hostPort 금지에 대한 유일한 예외다
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 40Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      enableServiceLinks: false
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            # 이미지 정리(phub gc)가 manifest 를 지울 수 있게
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          ports:
            - { containerPort: 5000, hostPort: 5000, hostIP: 127.0.0.1 }
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector: { app: registry }
  ports: [{ port: 5000, targetPort: 5000 }]
---
# phub gc 가 지운 manifest 의 레이어를 실제로 비운다(registry garbage-collect).
# ⭐ 스스로 돌지 않는다(suspend) — hub 의 `phub gc` 가 빌드 슬롯을 모두 잡은 채
#    `kubectl create job registry-gc-<시각> --from=cronjob/registry-gc` 로 이 템플릿을 실행하고 끝나면 지운다
#    (PHUB_REGISTRY_GC_INTERVAL, 기본 7일). push 와 GC 가 겹치지 않고, pull 은 그동안에도 된다(HL-5).
#    hub 없이 손으로 돌릴 때도 같은 명령을 쓰되, 빌드가 없는지 먼저 확인한다
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-gc
spec:
  suspend: true
  schedule: "0 5 * * 0"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: gc
              image: registry:2.8.3
              command: [registry, garbage-collect, --delete-untagged, /etc/docker/registry/config.yml]
              volumeMounts:
                - { name: data, mountPath: /var/lib/registry }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: "1", memory: 512Mi }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: registry }
---
# 레지스트리는 인증이 없어(push · delete 모두 열림) 닿는 곳을 실제로 쓰는 세 곳으로 좁힌다.
#   - buildkitd: 빌드한 이미지를 registry:5000 으로 push 한다
#   - hub: 같은 태그가 있는지 HEAD/GET 으로 확인한다(있으면 빌드를 건너뛴다)
#   - 노드(도커 데몬): localhost:5000 hostPort 로 이미지를 받는다. hostPort 연결은 cni0 게이트웨이(10.42.0.1)로
#     SNAT 되어 들어온다 — 2026-11-14 registry 로그의 remoteaddr 실측(11/03 이후 전체): 10.42.0.135(hub) ·
#     10.42.0.105(buildkitd) · 10.42.0.1(docker, Host localhost:5000) 셋뿐이었다. kubelet probe 도 10.42.0.1 이다.
# 그 밖의 파드(프리뷰 환경의 PR 코드, 다른 앱)는 막힌다 — 같은 태그를 덮어쓰거나 지워 이후 환경을 오염시키지 못하게.
# (격리 컴포넌트의 allow-same-namespace · traefik · monitoring 허용은 그대로 겹쳐 적용된다. 파드 두 줄은 그와 겹치지만
#  레지스트리를 쓰는 주체를 여기서 바로 읽게 하려고 둔다)
# ⚠️ 단일 노드 전제다(파드 CIDR 10.42.0.0/24). 노드를 늘리면 노드마다 게이트웨이 주소를 더한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-pull
spec:
  podSelector:
    matchLabels: { app: registry }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: buildkitd } }
        - podSelector: { matchLabels: { app: hub } }
        - ipBlock: { cidr: 10.42.0.1/32 }
      ports: [{ port: 5000, protocol: TCP }]
