# worker — 작업 큐(DIAGNOSE · SWEEP · CHECK_RESOLVE · DEPLOY_OBSERVE)를 돌리고 /metrics 를 8080 에서 내보낸다. 이미지는 api 와 같고 명령만 다르다.
# 비밀을 쥔 쪽은 이 파드다(DB · Discord 웹훅). 모델은 여기서 돌지 않는다 — 진단은 sandbox Service(http://sandbox.ai-sre.svc:8080)에 맡긴다(설계 07 §6).
# 효과 flag 는 DB 에서 기본 OFF 다. 봉쇄(containment)는 replicas 를 0 으로 내리는 것(소유자).
# k8s API 는 DEPLOY_OBSERVE(Argo CD Application 읽기, deploy_observe_enabled DB flag · 기본 OFF)만 쓴다 — 이 파드에만 토큰이 있다.
#   serviceAccountName ai-sre-reader(argocd 의 applications get · list · watch 뿐, rbac.yaml). 파드 수준 automount 는 그대로 끄고,
#   표준 경로 /var/run/secrets/kubernetes.io/serviceaccount 에 projected 볼륨(1 시간 토큰 · kube-root-ca.crt)을 worker 컨테이너에만 읽기 전용으로 건다.
#   길은 networkpolicy.yaml 의 worker-kube-api-egress. api · sandbox · db · backup 은 토큰도 길도 없다.
# /metrics 의 들어오는 길은 monitoring 의 Prometheus 에서만 열려 있다(networkpolicy.yaml 의 worker-ingress, B9b). Ingress 는 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      enableServiceLinks: false
      serviceAccountName: ai-sre-reader
      automountServiceAccountToken: false
      # SIGTERM 뒤 지금 하던 작업 하나를 끝내고 멈춘다. 진단 하나가 최대 300 초 걸리므로 그보다 길게 준다
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ai-sre
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ai_sre.worker"]
          env:
            - { name: AI_SRE_DATABASE_URL, value: "host=db port=5432 connect_timeout=5" }
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: ai-sre-db, key: POSTGRES_USER } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: ai-sre-db, key: POSTGRES_PASSWORD } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: ai-sre-db, key: POSTGRES_DB } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 8080, name: metrics }]
          # 작업 하나가 길게 걸려도 죽이지 않도록 liveness 는 두지 않는다(멈춘 진단은 AiSreDiagnosisStuck 이 잡는다)
          readinessProbe:
            httpGet: { path: /metrics, port: 8080 }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # 파일 이름 webhook-url. 보낼 때마다 다시 읽는다. notify_discord_enabled 가 OFF 인 동안은 보내지 않는다
            - { name: discord, mountPath: /var/run/secrets/ai-sre/discord, readOnly: true }
            # 클라이언트 표준 경로(token · ca.crt). 아래 projected 볼륨 — 다른 길로는 토큰이 들어오지 않는다
            - { name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: discord
          secret:
            secretName: ai-sre-discord
            items: [{ key: webhook-url, path: webhook-url }]
        # automount 대신 직접 거는 ServiceAccount 토큰. 기본 audience(API 서버), 1 시간마다 kubelet 이 갱신하고 파드가 지워지면 무효다
        # defaultMode 292 = 0444 — 컨테이너가 비루트(10001)라 읽을 수 있어야 한다
        - name: kube-api
          projected:
            defaultMode: 292
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
