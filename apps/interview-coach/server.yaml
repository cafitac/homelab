# 면접 서버(Kotlin · Spring). LLM 은 Claude Code CLI(CLAUDE_CODE_OAUTH_TOKEN, Secret server-env)를 하위 프로세스로 부른다
# 두 번째 계정(선택): server/.env 에 CLAUDE_CODE_OAUTH_TOKEN_FALLBACK 을 넣고 secrets.sh → 서버 재시작. 첫 계정이 사용량 한도 · 인증으로 막히면 쓴다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  # 새 파드가 시작 검사(아래 startupProbe — 나가는 길 포함)를 넘을 때까지 옛 파드가 계속 받는다
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: server }
  template:
    metadata:
      labels: { app: server }
    spec:
      # ⚠️ 서비스 정보를 환경변수로 주입하지 않는다 — Service server 가 SERVER_PORT=tcp://… 를 만들어 Spring 의 server.port 를 덮었다(2026-10-05)
      enableServiceLinks: false
      # k8s API 를 쓰지 않는다 — 서비스 계정 토큰을 파드에 두지 않는다(CLI 하위 프로세스가 읽을 거리를 줄인다)
      automountServiceAccountToken: false
      # 내릴 때 SIGTERM 뒤 45초까지 기다린다(preStop 5초 포함) — 열린 연결이 정리될 시간
      terminationGracePeriodSeconds: 45
      containers:
        - name: server
          image: interview-coach-server
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: server-env }
          env:
            - { name: DATABASE_URL, value: "jdbc:postgresql://db:5432/coach?currentSchema=app" }
            - { name: DATABASE_USERNAME, valueFrom: { secretKeyRef: { name: db-auth, key: POSTGRES_USER } } }
            - { name: DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: db-auth, key: POSTGRES_PASSWORD } } }
            - { name: KNOWLEDGE_URL, value: "http://knowledge:8792" }
            - { name: CLAUDE_BIN, value: /home/app/.local/bin/claude }
            - { name: TZ, value: Asia/Seoul }
            # 로그인 쿠키 ic_session 에 Secure 를 붙인다 — 서비스는 HTTPS(interview.cafitac.com)로만 열린다. 서버 기본값이 false 라 여기서 켠다
            - { name: COOKIE_SECURE, value: "true" }
            - { name: VOICE_TRAINING_DIR, value: /data/voice-training }
            # 말끝 모델 파일(앱이 GET /api/turn-models/<파일> 로 받는다 — interview-coach docs/design/end-of-turn.md 「합친 말끝 모델 — 그림자」)
            - { name: TURN_MODELS_DIR, value: /data/turn-models }
            # 어드민 「행동 · 결과」가 Umami 를 읽기 전용으로 읽는다(interview-coach docs/design/behavior-insights.md). 계정 umami_reader 는 secrets.sh 가 만든다.
            # Secret 이 아직 없으면(optional) 비어서 서버는 Umami 없이 앱 DB 결과만 보인다.
            - { name: UMAMI_DB_URL, value: "jdbc:postgresql://umami-db:5432/umami" }
            - { name: UMAMI_DB_USERNAME, valueFrom: { secretKeyRef: { name: umami-reader, key: USERNAME, optional: true } } }
            - { name: UMAMI_DB_PASSWORD, valueFrom: { secretKeyRef: { name: umami-reader, key: PASSWORD, optional: true } } }
            # 우리 목소리(TTS) 소리 캐시 — 아래 tts-cache PVC. 예전엔 /tmp(emptyDir)라 배포마다 비워져 미리 만들기가 문장 ~450개를 처음부터
            # 다시 합성했고, 그동안 하나뿐인 엔진을 쥐어 대화형이 504 로 기기 목소리에 넘어갔다(2026-10-28). 비밀이 아니라 Secret 이 아닌 여기 둔다
            - { name: MODEL_HOST_TTS_CACHE_DIR, value: /data/tts-cache }
          ports: [{ containerPort: 8791 }]
          # 종료 시작 전에 5초 쉰다 — Service 엔드포인트에서 빠지는 것이 퍼질 시간(느린 종료 표준 패턴)
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # 시작 검사 — 앱이 HTTP 로 답하고(로그인 전 401 도 정상이라 코드는 안 본다) Claude API 까지 나가는 길이 열렸는지.
          # 새 파드는 뜬 뒤 약 50~60초 동안 server-egress 허용 규칙이 아직 안 깔려 밖으로 못 나간다(k3s 내장 kube-router, 2026-10-27 운영 측정).
          # 그동안 Ready 가 되면 배포마다 1분쯤 LLM 호출이 실패한다 → 연결이 될 때까지 Ready 를 미룬다(응답 코드는 무관, 연결만).
          # 시작할 때만 본다 — 뜬 뒤 Anthropic 장애로 파드를 내리지 않게 readiness 에는 넣지 않는다. 5분 안에 못 나가면 재시작(옛 파드는 계속 받는다).
          startupProbe:
            exec:
              command: ["sh", "-c", "curl -s -o /dev/null -m 2 http://127.0.0.1:8791/actuator/health/liveness && curl -s -o /dev/null -m 3 https://api.anthropic.com/"]
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 8791 }
            periodSeconds: 10
          # 2026-10-06 서버가 CPU 0 으로 멈췄는데 TCP 준비 검사는 계속 통과해 아무도 재시작하지 않았다.
          # 실제 HTTP 응답을 보고 90초 넘게 응답이 없으면 재시작한다. 서버 안의 HangWatchdog 가 그 전(약 30초)에
          # 가상 스레드까지 담은 스레드 덤프를 로그에 남긴다. liveness 그룹은 DB 상태를 보지 않는다.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8791 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: voice-training, mountPath: /data/voice-training }
            # 서버는 읽기만 한다 — 파일은 아래 PVC 설명의 올리기 파드로 넣는다
            - { name: turn-models, mountPath: /data/turn-models, readOnly: true }
            - { name: tts-cache, mountPath: /data/tts-cache }
          # JVM(MaxRAMPercentage=65) 옆에서 Claude CLI(node) 가 뜬다 — 1Gi 에선 보강 준비 중 OOMKilled(2026-10-14)
          resources:
            # 메모리 7일 최대 1.3GiB(2026-10-18) — 요청이 이보다 낮으면 노드 압박 때 먼저 쫓겨난다
            requests: { cpu: 200m, memory: 1536Mi }
            limits: { cpu: "2", memory: 2560Mi }
      volumes:
        # Claude CLI 작업 폴더(CLAUDE_WORKDIR=/tmp/...)
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        # 말끝 학습용 목소리(동의한 계정만 — interview-coach docs/design/end-of-turn.md 「학습 데이터 수집」). DB · 백업 덤프에 들어가지 않는다
        - name: voice-training
          persistentVolumeClaim: { claimName: voice-training }
        - name: turn-models
          persistentVolumeClaim: { claimName: turn-models, readOnly: true }
        - name: tts-cache
          persistentVolumeClaim: { claimName: tts-cache }
---
# 말끝 학습 클립 — <user_id>/<날짜>/<clip_id>.flac|.json, 서버가 180일 뒤 · 7GiB 넘으면 오래된 것부터 지운다. 클립 하나 약 100–160KB
# Retain: PVC 를 지워도 데이터 폴더가 남는다 — 사용자가 지우라고 한 것은 서버 API(DELETE /api/me/voice-training/clips)로 지운다
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voice-training
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  # 쿼터 30Gi 중 남은 몫(db 10 · embedder 5 · backups 5 · umami 2). 서버가 7GiB 를 넘으면 오래된 클립부터 지운다(VOICE_TRAINING_MAX_TOTAL_BYTES)
  resources: { requests: { storage: 8Gi } }
---
# 말끝 모델 파일(오디오 smart-turn-ko · 글 KoELECTRA 말끝 모델 · 어휘, 합쳐 약 24MB) — 이름에 판이 들어 있어 바꿀 때는 새 이름으로 더한다(앱이 SHA-256 확인).
# 학습 녹음(voice-training)과 섞지 않으려고 따로 둔다. 원본: Mac Studio ~/turn-model/serve(SHA256SUMS 포함). 올리기(서버는 읽기 전용이라 잠깐 파드를 띄운다):
#   kubectl -n interview-coach run turn-models-load --image=busybox:1.36 --restart=Never --overrides='{"spec":{"volumes":[{"name":"m","persistentVolumeClaim":{"claimName":"turn-models"}}],
#     "containers":[{"name":"c","image":"busybox:1.36","command":["sleep","600"],"volumeMounts":[{"name":"m","mountPath":"/m"}]}]}}'
#   for f in ~/turn-model/serve/*; do kubectl -n interview-coach cp "$f" turn-models-load:/m/; done; kubectl -n interview-coach delete pod turn-models-load
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: turn-models
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources: { requests: { storage: 1Gi } }
---
# TTS 소리 캐시 — <키 앞 두 글자>/<키>.pcm(키에 모델 판 · 목소리 · 읽는 글이 들어 있어 판이 바뀌면 새 파일). 서버가 256MiB(MODEL_HOST_TTS_CACHE_MAX_BYTES)를
# 넘으면 오래 안 쓴 것부터 지운다. 지워져도 미리 만들기가 다시 채우는 캐시일 뿐이라 백업하지 않는다.
# RWO 지만 롤링 교체(maxSurge 1) 그대로 둔다 — local-path 는 노드 하나의 폴더라 같은 노드의 옛 · 새 파드가 함께 붙는다(voice-training 과 같다).
# 교체 중 두 파드가 같이 써도 깨지지 않는다 — 같은 폴더의 임시 파일에 쓴 뒤 원자적으로 옮기고(FileSpeechCache), 지우기는 없으면 넘어간다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tts-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: server
  # ServiceMonitor app(monitoring.yaml)이 Service 라벨로 고른다 — 없으면 Prometheus 가 이 Service 를 못 찾는다
  labels: { app: server }
spec:
  selector: { app: server }
  # 이름 http — ServiceMonitor(monitoring.yaml)가 이 이름으로 /actuator/prometheus 를 긁는다
  ports: [{ name: http, port: 8791, targetPort: 8791 }]
