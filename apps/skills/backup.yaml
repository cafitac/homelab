# skills.db 만 온라인 백업한다. snapshots 와 packs 는 owner 머신에서 다시 가져올 수 있다.
# 안쪽 7 일, 05:00 offload 로 밖에는 30 일 보관한다.
# 재가져오기 가능한 snapshot 만 먼저 prune 해 10 개를 남긴다(설계 07 §4).
# prune 실패에도 백업하며, 둘 중 하나라도 실패하면 Job 은 실패한다.
# 복원: owner 단계 — 에이전트는 하지 않는다. root 가 skills Application 을, skills 가 Git 의 web replicas: 1 을 복구하므로 둘 다 멈춘다.
# 1. root 먼저 중지: kubectl -n argocd patch app root --type merge -p '{"spec":{"syncPolicy":null}}'
# 1. skills 중지: kubectl -n argocd patch app skills --type merge -p '{"spec":{"syncPolicy":null}}'
# 2. web 중지: kubectl -n skills scale deploy/web --replicas=0
# 2. 데이터 PVC 를 사용하는 web Pod 종료 확인: kubectl -n skills wait --for=delete pod -l app=web --timeout=120s
# 3. web 이 0 이면 데이터 PVC 를 마운트한 Pod 가 없으므로 같은 이미지와 uid 10001 의 임시 Pod 생성: kubectl -n skills run skills-restore --image="$(kubectl -n skills get deploy/web -o jsonpath='{.spec.template.spec.containers[0].image}')" --restart=Never --overrides='{"spec":{"automountServiceAccountToken":false,"securityContext":{"runAsNonRoot":true,"runAsUser":10001,"runAsGroup":10001,"fsGroup":10001,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"skills-restore","image":"'"$(kubectl -n skills get deploy/web -o jsonpath='{.spec.template.spec.containers[0].image}')"'","command":["sh","-c","sleep 3600"],"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}},"volumeMounts":[{"name":"data","mountPath":"/data"},{"name":"backups","mountPath":"/backups"}]}],"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"data"}},{"name":"backups","persistentVolumeClaim":{"claimName":"backups"}}]}}'
# 3. 임시 Pod 준비 확인: kubectl -n skills wait --for=condition=Ready pod/skills-restore --timeout=120s
# 3. <dump> 를 복원할 파일명으로 바꿔 복사하고 WAL/SHM 삭제: kubectl -n skills exec skills-restore -- sh -c 'cp /backups/<dump> /data/skills.db && rm -f /data/skills.db-wal /data/skills.db-shm'
# 3. 임시 Pod 삭제: kubectl -n skills delete pod skills-restore --wait=true
# 4. web 시작: kubectl -n skills scale deploy/web --replicas=1
# 5. 역순으로 skills 자동 동기화 복구: kubectl apply -f argocd/apps/skills.yaml
# 5. root 자동 동기화 복구: kubectl apply -f argocd/root.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "50 4 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: skills-dashboard
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "python -m skills_web.admin prune --keep 10; p=$?; python /scripts/backup.py --data /data --out /backups --keep-days 7 || exit 1; exit $p"]
              envFrom:
                - secretRef: { name: skills-access }
              env:
                - { name: SKILLS_DATA_DIR, value: /data }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: backups, mountPath: /backups }
                - { name: backup-script, mountPath: /scripts, readOnly: true }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: data }
            - name: backups
              persistentVolumeClaim: { claimName: backups }
            - name: backup-script
              configMap: { name: backup-script }
