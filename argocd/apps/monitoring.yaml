# 모니터링 — 차트 네 개(kps · blackbox · loki · alloy, 값은 이 저장소) + 이 저장소의 매니페스트(네임스페이스 · 프로브 · 규칙 · 대시보드)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.9.0
      helm:
        releaseName: kps
        valueFiles: [$values/monitoring/kube-prometheus-stack.values.yaml]
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 11.19.1
      helm:
        releaseName: blackbox
        valueFiles: [$values/monitoring/blackbox.values.yaml]
    # 로그 — Loki(저장 · 검색) + Alloy(수집). 값: monitoring/loki.values.yaml · alloy.values.yaml
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        releaseName: loki
        valueFiles: [$values/monitoring/loki.values.yaml]
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.3
      helm:
        releaseName: alloy
        valueFiles: [$values/monitoring/alloy.values.yaml]
    - repoURL: https://github.com/cafitac/homelab.git
      targetRevision: main
      ref: values
      path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions:
      # CRD 가 커서 client-side apply 의 annotation 한도(256KB)를 넘는다
      - ServerSideApply=true
