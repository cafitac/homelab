# hub(+ bot 사이드카)가 프리뷰 환경 namespace phub-<env> 를 만들고 · 채우고 · 지운다.
# ⚠️ RBAC 은 이름 접두사로 범위를 좁힐 수 없다 — 클러스터 전체 권한이다. 대신 러너가
#    ① 소유 라벨(dev.phub.managed)이 붙은 namespace 만 지우고 ② 모든 조회 · 정리를 라벨로 한정한다.
#    더 좁히려면 승인 정책(ValidatingAdmissionPolicy)으로 phub-* 밖의 쓰기를 막는다 — homelab PLAN 위험 항목
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-hub
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [services, resourcequotas, persistentvolumeclaims]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-hub
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: preview-hub
