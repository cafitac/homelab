apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: local-path-retain
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  storageClassName: local-path-retain
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
