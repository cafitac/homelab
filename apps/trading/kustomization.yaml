# trading.cafitac.com — tradelab 대시보드(읽기 전용 FastAPI + React) · 쓰기 Job 틀 · 백업. 앞단은 Cloudflare Access.
# 이미지 갱신: trading-system 저장소에서 deploy/k8s/release.sh — 출력된 두 newTag(같은 태그)를 아래에 넣는다.
#   lab.yaml 의 TRADELAB_BUILD_SHA 도 같은 값으로 바꾼다
# 비밀값: secrets.sh(Mac Studio, 사용자가 손으로) — 저장소에 없다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trading
resources:
  - namespace.yaml
  - quota.yaml
  - data.yaml
  - lab.yaml
  - batch.yaml
  - backup.yaml
components:
  - ../../platform/components/isolation
configMapGenerator:
  - name: backup-script
    files:
      - backup.py=scripts/backup.py
images:
  - name: trading-lab
    newTag: 344439bb752a        # image ID sha256:e7029c41d4dedac8b3d1204b8b457d5ecafb645f8cfc43273d0c0dfa2ea1bfff
  - name: trading-batch
    newTag: 344439bb752a        # image ID sha256:a239330ff54f2598e7f1def91550cbd0c9e0953e710cd3cf9e61fe12a547056b
