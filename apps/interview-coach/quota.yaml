# 컨테이너 상한 합 약 12.6GiB(embedder 7GiB · server 2.5GiB · umami 0.75GiB) + 롤링 교체 여유. 실사용(2026-10-05) embedder 4.9GiB · 나머지 합 1GiB 미만
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 8Gi
    # CPU 상한은 동시에 다 쓰는 값이 아니다(embedder 4 · server 2 · 나머지 각 1) — 합만 맞춘다
    limits.cpu: "14"
    limits.memory: 17Gi
    # umami-archive 40 · db 10 · voice-training 8 · embedder 5 · backups 5 · umami 2 · turn-models 1
    requests.storage: 71Gi
    persistentvolumeclaims: "7"
