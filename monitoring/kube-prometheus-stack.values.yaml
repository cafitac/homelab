# kube-prometheus-stack 91.9.0 — 단일 노드 k3s 에 맞춘 값
# ⚠️ 격리 컴포넌트(기본 거부)를 이 namespace 에는 붙이지 않는다. 오퍼레이터의 admission webhook 을 API 서버가 불러야 한다

# k3s 는 컨트롤 플레인을 한 프로세스에 묶어 이 대상들의 지표 포트가 열려 있지 않다 — 켜 두면 항상 「대상 다운」 경보가 뜬다
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }

# ⭐ 도메인으로 연다 — 반드시 Cloudflare Access(본인 이메일 인증) 뒤에서만. Prometheus · Alertmanager 는 자체 인증이 없다.
#    순서: Access 앱을 먼저 만들고 → 그 다음 DNS(cloudflared tunnel route dns homelab <호스트>). 반대로 하면 인증 없이 열리는 순간이 생긴다
prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [prometheus.cafitac.com]
    paths: [/]
  prometheusSpec:
    externalUrl: https://prometheus.cafitac.com
    retention: 15d
    retentionSize: 25GB
    resources:
      requests: { cpu: 200m, memory: 1536Mi }
      limits: { cpu: "1", memory: 3Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 30Gi } }
    # 라벨을 맞추지 않아도 모든 namespace 의 ServiceMonitor · Probe · PrometheusRule 을 읽는다
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  # ⭐ 사람에게 가는 수신처는 Discord 웹훅 하나(사용자 결정 2026-10-29 「디스코드로 하고 웹 후크 발급받아놨어」 — 2026-10-05 「아직 연결하지말자」를 대체).
  #    그 밖에 ai-sre 웹훅이 경보 사본을 받는다(A11, 아래 routes 맨 앞).
  #    웹훅 주소는 저장소에 없다 — Secret alertmanager-discord(키 webhook-url · ai-sre-token)를 monitoring 에 먼저 만들어야 한다.
  #    ⚠️ Secret 이 없으면 alertmanager 파드가 볼륨 마운트에서 막혀 뜨지 못한다. 만든 뒤에 이 변경을 반영한다.
  #    만들기: kubectl -n monitoring create secret generic alertmanager-discord --from-literal=webhook-url='<웹훅 주소>'
  #    ⚠️ 웹훅 주소를 바꿀 때는 다시 만들지 말고 patch 한다 — 다시 만들면 키 ai-sre-token 이 사라져 ai-sre 로 가는 것만 조용히 끊긴다
  #       (ai-sre-token 을 넣는 명령: PR #196 본문 · apps/ai-sre 의 Secret ai-sre-alertmanager 키 token 과 같은 값)
  config:
    global:
      resolve_timeout: 5m
    # inhibit_rules(차트 기본: critical 이 떠 있으면 같은 대상의 warning · info 를 억제)와 templates 는 차트 기본값을 그대로 쓴다
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # ⭐ ai-sre(설계 07 §13) — 맨 앞 + continue: true 라 경보의 사본만 받고, 아래 경로(Discord 포함)는 이 경로가 없을 때와 똑같이 고른다.
        #    받는 범위: critical · warning 전부(대상 판별은 ai-sre 가 한다 — 대상 밖이면 감사 기록만 남긴다).
        #    빼는 것: 하트비트 · 억제용, ai-sre 자신의 경보(AiSre.* · namespace ai-sre — AiSre.* 는 맨 끝 경로가 Discord 로 보낸다), Alertmanager.*(웹훅 실패 경보가 실패하는 웹훅으로 가는 고리)
        #    검사: monitoring/alertmanager_test.py(CI .github/workflows/amtool.yml)
        - receiver: ai-sre
          continue: true
          matchers:
            - severity =~ "critical|warning"
            - alertname !~ "AiSre.*|Alertmanager.*|Watchdog|InfoInhibitor"
            - namespace != "ai-sre"
        # 하트비트 · 차트의 억제용 경보는 어디로도 보내지 않는다
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        # 이 저장소의 규칙(monitoring/rules.yaml · apps/interview-coach/monitoring.yaml) — severity 는 critical · warning 두 가지뿐이다
        - receiver: discord
          matchers:
            - severity =~ "critical|warning"
            - alertname =~ "InterviewCoach.*|NodeDataDisk.*|PrometheusStorageNearRetentionSize|PublicSiteDown|NodeClockNotSynchronising"
        # 우리 앱 namespace 에서 난 차트 기본 경보(CrashLoop · 파드 미준비 등) — 그 밖의 차트 기본 경보는 기본 수신처 null
        - receiver: discord
          matchers:
            - severity =~ "critical|warning"
            - namespace =~ "interview-coach|judge-board|portfolio|ppt|trading|preview-hub"
        # ai-sre 자신의 경보(apps/ai-sre/monitoring.yaml, B9b) — 맨 앞 ai-sre 경로가 일부러 뺀 것(고리 방지)이라 Discord 로만 간다.
        #    alertname 으로만 고른다: 위 경로들과 겹치지 않아 다른 경보의 수신처는 그대로다(alertmanager_test.py 가 지문으로 확인).
        #    namespace ai-sre 의 차트 기본 경보(KubePodCrashLooping 등)는 여기 넣지 않았다 — 지금처럼 null(소유자 결정 대기)
        - receiver: discord
          matchers:
            - severity =~ "critical|warning"
            - alertname =~ "AiSre.*"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - send_resolved: true
            webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            title: '{{ if eq .Status "firing" }}🔥 경보{{ else }}✅ 해소{{ end }} {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}'
            message: |-
              {{ range .Alerts -}}
              **{{ .Labels.alertname }}** · 심각도 {{ .Labels.severity }}{{ with .Labels.namespace }} · namespace {{ . }}{{ end }}
              {{ with .Annotations.summary }}{{ . }}
              {{ end -}}
              {{ with .Annotations.description }}{{ . }}
              {{ end -}}
              시작 {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05" }} KST{{ if eq .Status "resolved" }} · 해소 {{ .EndsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05" }} KST{{ end }}
              {{ end }}
      # ai-sre api 의 웹훅(apps/ai-sre/api.yaml). 토큰은 api 가 읽는 Secret ai-sre/ai-sre-alertmanager(키 token)와 같은 값 —
      # 소유자가 이미 마운트된 Secret alertmanager-discord 의 키 ai-sre-token 으로 복사한다(아래 alertmanagerSpec 주석). 파일은 요청마다 다시 읽힌다
      - name: ai-sre
        webhook_configs:
          - url: http://api.ai-sre.svc:8080/v1/alertmanager/webhook
            send_resolved: true
            max_alerts: 50
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-discord/ai-sre-token
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [alertmanager.cafitac.com]
    paths: [/]
  alertmanagerSpec:
    externalUrl: https://alertmanager.cafitac.com
    # /etc/alertmanager/secrets/alertmanager-discord/webhook-url 로 마운트된다.
    # 같은 Secret 의 키 ai-sre-token 이 ai-sre 웹훅 토큰이다(receivers 의 ai-sre). 새 볼륨 · Secret 을 달지 않는 이유: 파드 템플릿이 바뀌면
    # 하나뿐인 파드가 다시 뜨고, 저장소가 emptyDir 라 silence · 알림 기록이 사라져 Discord 로 다시 가거나 가려 둔 경보가 나간다.
    # 키만 더하면 kubelet 이 재시작 없이 파일을 넣는다. 키가 없으면 ai-sre 로 보내기만 실패한다(Discord 는 그대로)
    secrets: [alertmanager-discord]
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 256Mi }

grafana:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.cafitac.com]
    path: /
  grafana.ini:
    server:
      root_url: https://grafana.cafitac.com
    # ⭐ Cloudflare Access 로그인을 그대로 믿는다 — Grafana 계정을 따로 기억하지 않는다.
    #    Access 가 요청마다 붙이는 Cf-Access-Jwt-Assertion 을 팀의 공개 키로 검증하고, 발급자가 우리 팀일 때만 받는다.
    #    이 팀의 토큰은 정책 owner 를 통과한 사람에게만 발급된다. admin 로그인 폼은 비상용으로 남긴다
    auth.jwt:
      enabled: true
      header_name: Cf-Access-Jwt-Assertion
      email_claim: email
      username_claim: email
      jwk_set_url: https://cafitac.cloudflareaccess.com/cdn-cgi/access/certs
      cache_ttl: 60m
      expect_claims: '{"iss": "https://cafitac.cloudflareaccess.com"}'
      auto_sign_up: true
      role_attribute_path: "'Admin'"
  # 관리자 비밀번호는 install.sh 가 무작위로 만들어 Secret 으로 넣는다(저장소에 없다)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 50m, memory: 512Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # 로그(monitoring/loki.values.yaml) — Explore 에서 {namespace="interview-coach", app="server"}
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData: { maxLines: 1000 }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
