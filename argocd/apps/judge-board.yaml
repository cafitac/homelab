apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: judge-board
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cafitac/homelab.git
    targetRevision: main
    path: apps/judge-board
  destination:
    server: https://kubernetes.default.svc
  # runner 는 채점 시간에만 손으로 올린다 — 그 값을 selfHeal 이 0 으로 되돌리지 않게
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: runner
      jsonPointers: [/spec/replicas]
  syncPolicy:
    # ⚠️ prune 끔 — DB · data(문제 꾸러미 · 제출) PVC
    automated: { prune: false, selfHeal: true }
    syncOptions: [RespectIgnoreDifferences=true]
