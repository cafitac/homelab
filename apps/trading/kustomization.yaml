# trading.cafitac.com — tradelab 대시보드(읽기 전용 FastAPI + React) · 쓰기 Job 틀 · 백업. 앞단은 Cloudflare Access.
# 이미지 갱신: trading-system 저장소에서 deploy/k8s/release.sh — 출력된 두 newTag(같은 태그)를 아래에 넣는다.
#   lab.yaml 의 TRADELAB_BUILD_SHA 도 같은 값으로 바꾼다
# 비밀값: secrets.sh(Mac Studio, 사용자가 손으로) — 저장소에 없다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trading
resources:
  - namespace.yaml
  - quota.yaml
  - data.yaml
  - lab.yaml
  - batch.yaml
  - backup.yaml
components:
  - ../../platform/components/isolation
configMapGenerator:
  - name: backup-script
    files:
      - backup.py=scripts/backup.py
images:
  - name: trading-lab
    newTag: c641fda4e22a        # image ID sha256:996019ea62e169c87763c870db807654f495cce5d96516d7be12b805846f6421
  - name: trading-batch
    newTag: c641fda4e22a        # image ID sha256:22602d13af562f0d4d6278c38c7a34a88e76aa99d6a9f3a10a0cbc27427b662b
