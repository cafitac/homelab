# hub(+ bot 사이드카)가 프리뷰 환경 namespace phub-<env> 를 만들고 · 채우고 · 지운다.
# ⚠️ RBAC 은 이름 접두사로 범위를 좁힐 수 없다 — 클러스터 전체 권한이다. 대신 러너가
#    ① 소유 라벨(dev.phub.managed)이 붙은 namespace 만 지우고 ② 모든 조회 · 정리를 라벨로 한정한다.
#    platform/admission/preview-hub-scope.yaml 의 승인 정책(ValidatingAdmissionPolicy)이 쓰기를 소유한 phub-*
#    namespace 와 그 안의 소유 리소스로 한정한다(클러스터 범위 객체라 namespace 를 붙이는 이 kustomization 밖에 둔다).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-hub
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [services, resourcequotas, persistentvolumeclaims]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-hub
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: preview-hub
---
# HL-5: hub 가 레지스트리 GC 템플릿(CronJob registry-gc)을 읽어 Job 을 만든다 — 이 namespace 안에서만.
# Job 생성 · 삭제 권한은 위 ClusterRole 에 있고, platform 승인 정책이 registry-gc-* 이름만 허용한다
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-registry-gc
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [registry-gc]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-registry-gc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-registry-gc
subjects:
  - kind: ServiceAccount
    name: hub
