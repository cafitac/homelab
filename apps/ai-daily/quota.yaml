# Job(Python + Claude CLI node) 하나와 nginx 하나. Job 은 하루 한 번 3~6분, 웹은 실사용 수 MiB
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 3Gi
    persistentvolumeclaims: "1"
    requests.storage: 2Gi
