# trading.cafitac.com — tradelab 대시보드(읽기 전용 FastAPI + React) · 쓰기 Job 틀 · 백업. 앞단은 Cloudflare Access.
# 이미지 갱신: trading-system 저장소에서 deploy/k8s/release.sh — 출력된 두 newTag(같은 태그)를 아래에 넣는다.
#   lab.yaml 의 TRADELAB_BUILD_SHA 도 같은 값으로 바꾼다
# 비밀값: secrets.sh(Mac Studio, 사용자가 손으로) — 저장소에 없다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trading
resources:
  - namespace.yaml
  - quota.yaml
  - data.yaml
  - lab.yaml
  - batch.yaml
  - backup.yaml
components:
  - ../../platform/components/isolation
configMapGenerator:
  - name: backup-script
    files:
      - backup.py=scripts/backup.py
images:
  - name: trading-lab
    newTag: a84130223d61        # image ID sha256:34b14a3349190dc821f7a2eb4f87f3c965c4d5180ec8e3accf82a560ae2778d9
  - name: trading-batch
    newTag: a84130223d61        # image ID sha256:85cb604222fb26ecac66c5f78370649ba381eb1f58a0d1e647abf62a8fca5843
