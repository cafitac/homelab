# argo-cd 10.9.6 (Argo CD v3.5.3) — 단일 노드 · Cloudflare Access 뒤
global:
  domain: argocd.cafitac.com

configs:
  params:
    # TLS 는 Cloudflare 가 끝낸다. 클러스터 안(cloudflared → Traefik → argocd-server)은 평문
    server.insecure: true
  cm:
    # ⭐ 로그인은 Cloudflare Access SSO(OIDC) 하나 — install.sh 가 Secret argocd-oidc 로 oidc.config 를 넣는다.
    #    익명 읽기는 끈다(v3.5 화면이 익명으로는 앱 목록을 그리지 못했다)
    users.anonymous.enabled: "false"
    # 로컬 admin 을 끈다 — 로그인은 SSO 하나. SSO 가 깨지면 kubectl 로 이 값을 true 로 바꾸고 argocd-initial-admin-secret 을 다시 만든다
    admin.enabled: "false"
    # git 을 3 분마다 본다(기본값). 공개 저장소라 자격 증명이 없다
    timeout.reconciliation: 180s
  rbac:
    # Access 정책 owner 를 통과한 사람만 SSO 로 들어온다 — 들어온 사람은 관리자다(1 인 운영)
    policy.default: role:admin
    scopes: "[email]"

dex:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.cafitac.com
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

redis:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

applicationSet:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

notifications:
  # 경보 수신처를 아직 정하지 않았다(사용자 결정) — 알림 컨트롤러도 끈다
  enabled: false
