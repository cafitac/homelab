# kube-prometheus-stack 91.9.0 — 단일 노드 k3s 에 맞춘 값
# ⚠️ 격리 컴포넌트(기본 거부)를 이 namespace 에는 붙이지 않는다. 오퍼레이터의 admission webhook 을 API 서버가 불러야 한다

# k3s 는 컨트롤 플레인을 한 프로세스에 묶어 이 대상들의 지표 포트가 열려 있지 않다 — 켜 두면 항상 「대상 다운」 경보가 뜬다
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }

# ⭐ 도메인으로 연다 — 반드시 Cloudflare Access(본인 이메일 인증) 뒤에서만. Prometheus · Alertmanager 는 자체 인증이 없다.
#    순서: Access 앱을 먼저 만들고 → 그 다음 DNS(cloudflared tunnel route dns homelab <호스트>). 반대로 하면 인증 없이 열리는 순간이 생긴다
prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [prometheus.cafitac.com]
    paths: [/]
  prometheusSpec:
    externalUrl: https://prometheus.cafitac.com
    retention: 15d
    retentionSize: 25GB
    resources:
      requests: { cpu: 200m, memory: 1536Mi }
      limits: { cpu: "1", memory: 3Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 30Gi } }
    # 라벨을 맞추지 않아도 모든 namespace 의 ServiceMonitor · Probe · PrometheusRule 을 읽는다
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  # ⭐ 수신처는 Discord 웹훅 하나(사용자 결정 2026-10-29 「디스코드로 하고 웹 후크 발급받아놨어」 — 2026-10-05 「아직 연결하지말자」를 대체).
  #    웹훅 주소는 저장소에 없다 — Secret alertmanager-discord(키 webhook-url)를 monitoring 에 먼저 만들어야 한다.
  #    ⚠️ Secret 이 없으면 alertmanager 파드가 볼륨 마운트에서 막혀 뜨지 못한다. 만든 뒤에 이 변경을 반영한다.
  #    만들기: kubectl -n monitoring create secret generic alertmanager-discord --from-literal=webhook-url='<웹훅 주소>'
  config:
    global:
      resolve_timeout: 5m
    # inhibit_rules(차트 기본: critical 이 떠 있으면 같은 대상의 warning · info 를 억제)와 templates 는 차트 기본값을 그대로 쓴다
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # 하트비트 · 차트의 억제용 경보는 어디로도 보내지 않는다
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        # 이 저장소의 규칙(monitoring/rules.yaml · apps/interview-coach/monitoring.yaml) — severity 는 critical · warning 두 가지뿐이다
        - receiver: discord
          matchers:
            - severity =~ "critical|warning"
            - alertname =~ "InterviewCoach.*|NodeDataDisk.*|PrometheusStorageNearRetentionSize|PublicSiteDown"
        # 우리 앱 namespace 에서 난 차트 기본 경보(CrashLoop · 파드 미준비 등) — 그 밖의 차트 기본 경보는 기본 수신처 null
        - receiver: discord
          matchers:
            - severity =~ "critical|warning"
            - namespace =~ "interview-coach|judge-board|ai-daily|portfolio|ppt|trading|startup|preview-hub"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - send_resolved: true
            webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            title: '{{ if eq .Status "firing" }}🔥 경보{{ else }}✅ 해소{{ end }} {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}'
            message: |-
              {{ range .Alerts -}}
              **{{ .Labels.alertname }}** · 심각도 {{ .Labels.severity }}{{ with .Labels.namespace }} · namespace {{ . }}{{ end }}
              {{ with .Annotations.summary }}{{ . }}
              {{ end -}}
              {{ with .Annotations.description }}{{ . }}
              {{ end -}}
              시작 {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05" }} KST{{ if eq .Status "resolved" }} · 해소 {{ .EndsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05" }} KST{{ end }}
              {{ end }}
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [alertmanager.cafitac.com]
    paths: [/]
  alertmanagerSpec:
    externalUrl: https://alertmanager.cafitac.com
    # /etc/alertmanager/secrets/alertmanager-discord/webhook-url 로 마운트된다
    secrets: [alertmanager-discord]
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 256Mi }

grafana:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.cafitac.com]
    path: /
  grafana.ini:
    server:
      root_url: https://grafana.cafitac.com
    # ⭐ Cloudflare Access 로그인을 그대로 믿는다 — Grafana 계정을 따로 기억하지 않는다.
    #    Access 가 요청마다 붙이는 Cf-Access-Jwt-Assertion 을 팀의 공개 키로 검증하고, 발급자가 우리 팀일 때만 받는다.
    #    이 팀의 토큰은 정책 owner 를 통과한 사람에게만 발급된다. admin 로그인 폼은 비상용으로 남긴다
    auth.jwt:
      enabled: true
      header_name: Cf-Access-Jwt-Assertion
      email_claim: email
      username_claim: email
      jwk_set_url: https://cafitac.cloudflareaccess.com/cdn-cgi/access/certs
      cache_ttl: 60m
      expect_claims: '{"iss": "https://cafitac.cloudflareaccess.com"}'
      auto_sign_up: true
      role_attribute_path: "'Admin'"
  # 관리자 비밀번호는 install.sh 가 무작위로 만들어 Secret 으로 넣는다(저장소에 없다)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 50m, memory: 512Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # 로그(monitoring/loki.values.yaml) — Explore 에서 {namespace="interview-coach", app="server"}
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData: { maxLines: 1000 }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
