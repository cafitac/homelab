# ai-sre — 알림 → 장애 → 격리 진단 → Discord 보고(비공개 저장소 cafitac/ai-sre). 설계: 07 §13.
# A10a: namespace · 격리 정책 · DB · 백업. A10b: api · worker · sandbox 와 Argo CD Application(argocd/apps/ai-sre.yaml, prune 끔 — db · backups PVC).
# 비밀값은 저장소에 없다. 소유자가 머지 전에 만든다(이름 · 키만 여기 적는다):
#   ai-sre-db(POSTGRES_USER · POSTGRES_PASSWORD · POSTGRES_DB) — db · backup · api · worker
#   ai-sre-alertmanager(token) — api.  ai-sre-discord(webhook-url) — worker.  ai-sre-claude(oauth-token) — sandbox 만
#   (선택) ConfigMap ai-sre-secret-fingerprints(secret-fingerprints) — sandbox 의 비밀값 지문, 없어도 뜬다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: ai-sre 와 같지만 적어 둔 namespace 는 그대로 둔다(unsetOnly) — rbac.yaml 의 Role · RoleBinding 은 argocd 에 있어야 한다
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: ai-sre-namespace
      namespace: ai-sre
    unsetOnly: true
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - db.yaml
  - backup.yaml
  - api.yaml
  - worker.yaml
  - sandbox.yaml
  - rbac.yaml
  - monitoring.yaml
# 이미지는 레지스트리 없이 태그=cafitac/ai-sre 커밋(12 자리)으로 가져온다(apps/skills · apps/ppt 와 같다). 빌드 · import 는 소유자(H2).
#   ai-sre         = docker/api.Dockerfile (api · worker 공용)
#   ai-sre-sandbox = docker/sandbox/Dockerfile (docker/sandbox.Dockerfile 이 아니다 — 그것은 CLI 만 든 옛 이미지)
images:
  - name: ai-sre
    newTag: "9f38b3995c9b"
  - name: ai-sre-sandbox
    newTag: "9f38b3995c9b"
