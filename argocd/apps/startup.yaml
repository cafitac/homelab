apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: startup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cafitac/homelab.git
    targetRevision: main
    path: apps/startup
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # ⚠️ prune 끔 — 데이터 PVC(startup-data)
    automated: { prune: false, selfHeal: true }
