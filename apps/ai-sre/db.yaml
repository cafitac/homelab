# PostgreSQL 16. 스키마는 ai-sre 저장소의 마이그레이션이 만든다(api 시작 때, 앞으로만 · 더하기만).
# 같은 namespace 안에서도 api · worker · scorer · sweep · backup 파드만 닿는다(networkpolicy.yaml).
# 비밀값: Secret ai-sre-db(키 POSTGRES_USER · POSTGRES_PASSWORD · POSTGRES_DB) — 저장소에 없다. 소유자가 먼저 만든다. 없으면 db-0 이 뜨지 못한다.
# 이미지는 태그 16-alpine 의 인덱스 다이제스트로 고정했다(2026-11-12 조회). 올릴 때는 태그와 다이제스트를 함께 바꾼다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # postgres:16-alpine 의 postgres 계정(uid · gid 70)으로 바로 뜬다 — 루트로 시작해 chown 하지 않는다. PV 디렉터리는 local-path 가 0777 로 만든다
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: ai-sre-db, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: ai-sre-db, key: POSTGRES_PASSWORD } } }
            - { name: POSTGRES_DB, valueFrom: { secretKeyRef: { name: ai-sre-db, key: POSTGRES_DB } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # 지워져도 PV · 데이터가 남는 클래스(platform/storage/local-path-retain.yaml). 데이터는 외장 SSD 위 VM 디스크에 있다
        storageClassName: local-path-retain
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: { app: db }
  ports: [{ port: 5432, targetPort: 5432 }]
