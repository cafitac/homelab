# tradelab 쓰기 Job 의 틀 — suspend: true 라 스스로 돌지 않는다. 실행은 trading-system 의 deploy/k8s/job.sh 가
# 이 CronJob 에서 Job tradelab-writer 를 하나 만든다(job.sh 가 띄우는 쓰기 Job 은 한 번에 하나).
# 이 밖의 쓰기 주체는 모의 장부 일일 Job(paper.yaml, tradelab-paper, 화–토 08:30)뿐이다. 둘이 겹치면 SQLite 잠금(WAL · busy_timeout)이
# 쓰기를 차례로 처리한다 — 그 시각에는 무거운 job.sh 작업을 피한다.
# 파드 계약(trading-system deploy/k8s/README.md "Pod contract for D4"):
#  - command 를 덮지 않는다(엔트리포인트가 python -m tradelab.batch). args 는 job.sh 가 채운다
#  - ~/.tradelab/env 는 메모리 emptyDir(1Mi): 엔트리포인트가 Secret 파일을 0600 · 실행 uid 소유로 여기 복사한다
#  - ~/.tradelab/claude-config 는 마운트하지 않는다: emptyDir 은 root 소유라 Claude 게이트웨이가 거부한다(엔트리포인트가 데이터 볼륨에 만든다)
#  - 환경변수에 ANTHROPIC_* · CLAUDE_CODE_USE_* · 자격 증명을 두지 않는다(엔트리포인트가 시작을 거부한다)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tradelab-batch
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # 로그는 볼륨(~/.tradelab/logs)에도 남는다. 끝난 Job 은 job.sh 가 다음 실행 때 지우고, 아니면 7일 뒤 사라진다
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: batch
              image: trading-batch
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: data, mountPath: /home/app/.tradelab }
                - { name: env, mountPath: /home/app/.tradelab/env }
                - { name: stockdata, mountPath: /home/app/.tradelab/stock }
                - { name: tmp, mountPath: /tmp }
                - { name: claude, mountPath: /secrets/claude, readOnly: true }
                - { name: kis, mountPath: /secrets/kis, readOnly: true }
                - { name: toss, mountPath: /secrets/toss, readOnly: true }
                - { name: stockdata-secret, mountPath: /secrets/stockdata, readOnly: true }
              resources:
                # parallel --max 6: 여러 tradelab 프로세스 + 결정마다 claude CLI. 실측(AD18) 뒤 D5 에서 조정
                requests: { cpu: 500m, memory: 3Gi }
                limits: { cpu: "4", memory: 6Gi }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: trading-data }
            # 개별 주식 연구 데이터(S5D) — stock 명령만 쓴다
            - name: stockdata
              persistentVolumeClaim: { claimName: trading-stockdata }
            - name: env
              emptyDir: { medium: Memory, sizeLimit: 1Mi }
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
            # optional: Secret 이 아직 없어도 파드는 뜬다 — Secret 이 필요 없는 명령(report · cases · import-wait)은 돌고,
            # 필요한 명령은 엔트리포인트가 빈 디렉터리를 보고 exit 78 로 멈춘다(secrets.sh 를 먼저 돌린다)
            - name: claude
              secret: { secretName: tradelab-claude, optional: true }
            - name: kis
              secret: { secretName: tradelab-kis, optional: true }
            # 토스증권 조회 전용 키(toss 명령만 사용) — S3T. 주문 경로는 없다
            - name: toss
              secret: { secretName: tradelab-toss, optional: true }
            # 개별 주식 무료 데이터 소스 키 · SEC 연락처 · 가명 키(stock 명령만 사용) — S5D
            - name: stockdata-secret
              secret: { secretName: tradelab-stockdata, optional: true }
