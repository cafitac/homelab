# 프리뷰 이미지 빌더. hub 가 buildctl 로 고정 커밋 체크아웃을 보낸다.
# ⚠️ privileged — root buildkitd 의 요구 사항(rootless 는 이 노드에서 user namespace 설정이 더 필요하다).
#    같은 namespace(hub)에서만 닿는다(격리 컴포넌트)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 30Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: buildkitd }
  template:
    metadata:
      labels: { app: buildkitd }
    spec:
      enableServiceLinks: false
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.25.1
          args: ["--addr", "tcp://0.0.0.0:1234"]
          securityContext: { privileged: true }
          ports: [{ containerPort: 1234 }]
          # buildctl 의 기본 주소는 유닉스 소켓이라 exec 검사가 실패한다 — TCP 로만 연다
          readinessProbe:
            tcpSocket: { port: 1234 }
            periodSeconds: 10
          volumeMounts:
            - { name: cache, mountPath: /var/lib/buildkit }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            # 빌드 동시성 2(catalog build_concurrency)
            limits: { cpu: "4", memory: 6Gi }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: buildkit-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
spec:
  selector: { app: buildkitd }
  ports: [{ port: 1234, targetPort: 1234 }]
