apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skills
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cafitac/homelab.git
    targetRevision: main
    path: apps/skills
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # PVC 데이터를 실수로 지우지 않도록 삭제는 사람이 한다.
    automated: { prune: false, selfHeal: true }
