apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skills-runner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cafitac/homelab.git
    targetRevision: main
    path: apps/skills-runner
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # prune 을 끈다 — namespace 를 지우면 owner 가 만든 Secret 이 함께 사라진다. 지울 때는 사람이 한다.
    automated: { prune: false, selfHeal: true }
