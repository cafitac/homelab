# homelab 경보 규칙. 차트 기본 규칙(노드 · 쿠버네티스)에 더해, 실제로 겪은 장애를 막는 것만 둔다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: homelab.disk
      rules:
        # 10/3 thread-example 은 VM 데이터 디스크가 차서 33 시간 멈췄다. 이 클러스터의 PV 와 이미지가 모두 이 디스크에 있다
        - alert: NodeDataDiskFillingUp
          expr: |
            1 - node_filesystem_avail_bytes{mountpoint="/var/lib/rancher"}
              / node_filesystem_size_bytes{mountpoint="/var/lib/rancher"} > 0.80
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "k8s 노드 데이터 디스크 {{ $value | humanizePercentage }} 사용"
            description: "PV · 이미지가 있는 디스크다. 90% 를 넘기 전에 PVC 를 정리하거나 cluster/up.sh 의 --disk 를 늘린다"
        - alert: NodeDataDiskAlmostFull
          expr: |
            1 - node_filesystem_avail_bytes{mountpoint="/var/lib/rancher"}
              / node_filesystem_size_bytes{mountpoint="/var/lib/rancher"} > 0.90
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "k8s 노드 데이터 디스크 {{ $value | humanizePercentage }} — 곧 DB 가 멈춘다"
    - name: homelab.prometheus
      rules:
        # ⭐ Prometheus 데이터는 retention 15d · retentionSize 25GB 중 먼저 닿는 쪽에서 오래된 블록부터 지운다(PVC 30Gi).
        #    25GB 에 가까워지면 15 일을 못 채우고 잘리기 시작한 것이다 — 수집 대상 · 라벨이 늘었다는 뜻이다
        - alert: PrometheusStorageNearRetentionSize
          expr: sum(prometheus_tsdb_storage_blocks_bytes + prometheus_tsdb_wal_storage_size_bytes) > 0.9 * 25e9
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Prometheus 데이터 {{ $value | humanize1024 }}B — retentionSize 25GB 의 90%"
            description: "보존 기간 15 일보다 먼저 크기 상한으로 잘리고 있다. 수집 대상 · 카디널리티를 줄이거나 retentionSize 와 PVC 를 함께 늘린다"
    - name: homelab.sites
      rules:
        # 10/3 장애는 화면에 오류율 100% 가 떠 있었는데 아무도 몰랐다
        - alert: PublicSiteDown
          expr: probe_success{job="probe/monitoring/public-sites"} == 0
          for: 3m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.instance }} 가 밖에서 열리지 않는다"
    - name: homelab.devhost
      rules:
        # 개발 호스트(MacBook · Mac Studio)의 디스크 — agent-skills hostguard 가 15 분마다 쓰는 textfile 지표(monitoring/hostguard-scrape.yaml)다.
        # 11/14 MacBook 디스크가 차 검증이 ENOSPC 로 세 번 죽었다. 파일은 마지막 값을 그대로 들고 있어서(호스트가 자도 값이 남는다) 표본 시각이 2 시간 안일 때만 본다 —
        # 덮개를 닫은 MacBook 은 경보가 아니다(plan R3). 하한 · 증가 판단은 hostguard 가 한 것을 그대로 쓴다(여기에 숫자를 따로 두지 않는다)
        - alert: DevHostDiskLow
          expr: |
            hostguard_free_bytes < hostguard_floor_bytes
              and on(host) (time() - hostguard_sample_timestamp_seconds < 7200)
          for: 15m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.host }} 디스크 여유 {{ $value | humanize1024 }}B — hostguard 하한 아래"
            description: "무거운 검증은 이미 거부된다. hostguard report(해당 호스트)로 무엇이 차지하는지 보고, 정리는 사람이 한다"
        - alert: DevHostDiskFillingUp
          expr: |
            hostguard_time_to_floor_active == 1
              and on(host) (time() - hostguard_sample_timestamp_seconds < 7200)
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.host }} 디스크가 깨어 있는 시간 기준으로 곧 하한에 닿는다"
            description: "hostguard TIME_TO_FLOOR — 깨어 있는 동안의 감소 속도가 ttf_hours 안에 하한에 닿는다. 어제 같은 브라우저 프로필 누수가 이 모양이었다"
        # Mac Studio 는 늘 켜져 있다 — 표본이 2 시간 넘게 갱신되지 않았거나 아예 없으면 hostguard 작업 · textfile 내보내기 · 이 수집 경로 중 하나가 끊긴 것이다
        - alert: DevHostDiskGuardStale
          expr: |
            (time() - hostguard_sample_timestamp_seconds{host="macstudio"} > 7200)
              or absent(hostguard_sample_timestamp_seconds{host="macstudio"})
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Mac Studio hostguard 표본이 2 시간 넘게 없다"
            description: "Studio 의 dev.cafitac.hostguard · dev.cafitac.hostguard-textfile(launchd) · export.mode 플래그 · up{job=\"hostguard-textfile\"} 를 차례로 본다"
